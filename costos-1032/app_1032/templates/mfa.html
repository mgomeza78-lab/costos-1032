{% extends "base.html" %}
{% block title %}Verificación · Costos 1032{% endblock %}
{% block body %}
<div class="login-card">
  <h1>Segundo factor</h1>
  <p class="sub">Ingrese el código de seis dígitos de su aplicación de autenticación.</p>
  <form method="post" action="/mfa" class="form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Código
      <input name="codigo" inputmode="numeric" autocomplete="one-time-code" required autofocus
             pattern="[0-9 ]*" placeholder="123456">
    </label>
    <button type="submit" class="btn primary">Verificar</button>
  </form>
  <p class="hint"><a href="/logout">Cancelar</a></p>
</div>
{% endblock %}
